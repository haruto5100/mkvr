<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マリオカートワールド VR管理システム</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>VR管理システム</h1>

        <div class="stats-section">
            <p>最高VR: <span id="maxVrDisplay" style="font-weight: bold; color: var(--primary-color);">---</span></p>
        </div>
        
        <div class="input-section">
            <input type="number" id="vrInput" placeholder="現在のVRを入力" required>
            <button id="saveBtn">記録する</button>
        </div>

        <div class="chart-section">
            <canvas id="vrChart"></canvas>
        </div>

        <div class="history-section">
            <h2>履歴</h2>
            <ul id="historyList"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
