<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マリオカートワールド VR管理システム</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>VR管理システム</h1>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
    
            <div class="stats-section">
                <span style="font-weight: bold;">最高VR: <span id="maxVrDisplay" style="color: var(--primary-color); font-size: 1.2rem;">---</span></span>
            </div>

            <div class="data-management-section">
                <button id="exportBtn" style="padding: 6px 12px; font-size: 0.9rem; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background-color: #fff;">CSVエクスポート</button>
                <button id="importBtn" style="padding: 6px 12px; font-size: 0.9rem; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background-color: #fff; margin-left: 8px;">CSVインポート</button>
                <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
            </div>
    </div>
        
        <div class="input-section">
            <input type="number" id="vrInput" placeholder="現在のVRを入力" required>
            <button id="saveBtn">記録する</button>
        </div>

        <div class="chart-section">
            <canvas id="vrChart"></canvas>
        </div>

        <div class="history-section">
            <h2>履歴</h2>
            <ul id="historyList"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
